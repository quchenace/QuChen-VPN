<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 QuChen 账号</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #2563eb;
    --brand-2: #7c3aed;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 12% 0%, #eef2ff 0%, #ffffff 45%, #f8fafc 100%);
    color: var(--fg); font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    width: 380px; padding: 30px 30px 24px; border-radius: 16px;
    background: rgba(255, 255, 255, .92); border: 1px solid var(--line);
    box-shadow: 0 18px 46px rgba(15, 23, 42, .10);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dot {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  .brand b { font-size: 16px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--fg);
    font-size: 13.5px; outline: none; transition: border-color .15s, box-shadow .15s;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  button {
    width: 100%; height: 42px; margin-top: 20px; border: 0; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .msg.err { color: var(--err); }
  .foot { margin-top: 14px; font-size: 11.5px; color: #94a3b8; text-align: center; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="brand"><span class="dot"></span><b>QUCHEN VPN</b></div>
    <p class="sub">请登录 QuChen 账号后使用。账号需经管理员审批。</p>
    <label for="email">邮箱</label>
      <div id="qcTabs" style="display:flex;gap:6px;margin:0 0 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:4px">
        <button id="tabLogin" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:rgba(255,255,255,.10);color:#e8ecf2;font:14px/1 inherit;font-weight:600;cursor:pointer">登录</button>
        <button id="tabRegister" type="button" style="flex:1;padding:9px 0;border:0;border-radius:8px;background:transparent;color:#8b93a3;font:14px/1 inherit;cursor:pointer">注册</button>
      </div>
    <input id="email" type="email" placeholder="you@example.com" spellcheck="false" />
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码" />
    <button id="submit" type="submit" disabled>登录</button>
    <div class="msg" id="msg">正在连接账号服务…</div>
      <div id="qcRegPane" style="display:none">
        <div style="margin:2px 0 14px;font-size:12.5px;line-height:1.65;color:#8b93a3;text-align:left">
          用邮箱注册 QuChen 账号，一个账号可在曲辰套件各端登录。
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="regEmail" type="email" placeholder="you@example.com" spellcheck="false" autocomplete="username"
            style="flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
          <button id="regSend" type="button"
            style="white-space:nowrap;padding:12px 14px;border-radius:10px;border:1px solid rgba(90,150,255,.55);background:rgba(40,80,160,.28);color:#9dc0ff;font:14px/1 inherit;cursor:pointer">获取验证码</button>
        </div>
        <input id="regCode" type="text" inputmode="numeric" maxlength="6" placeholder="邮箱验证码（6 位）" autocomplete="one-time-code" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <input id="regPassword" type="password" placeholder="设置密码（至少 8 位）" autocomplete="new-password" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <input id="regPassword2" type="password" placeholder="再输一次密码" autocomplete="new-password" style="width:100%;margin-top:10px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#e8ecf2;font:15px/1.4 inherit;outline:none;box-sizing:border-box">
        <button id="regSubmit" type="button"
          style="width:100%;margin-top:14px;padding:12px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#4d8dff,#3f7aee);color:#fff;font:15px/1 inherit;font-weight:600;cursor:pointer">注册账号</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:#7d8595;text-align:center">忘记密码？<a href="https://frp-any.com:19549/login.html#reset" target="_blank" rel="noopener" style="color:#6aa2ff;text-decoration:none;margin-left:2px">到官网账号中心重置</a></div>
    <div class="foot">登录状态本地保存，离线可用 7 天（服务端可调）</div>
  </form>
<script>
(function () {
  var form = document.getElementById('form');
  var emailEl = document.getElementById('email');
  var passEl = document.getElementById('password');
  var btn = document.getElementById('submit');
  var msgEl = document.getElementById('msg');
  var api = null;

  function setMsg(text, isError) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (isError ? ' err' : '');
  }

  function ready() {
    if (!window.pywebview || !window.pywebview.api) return;
    api = window.pywebview.api;
    btn.disabled = false;
    setMsg('', false);
    try {
      Promise.resolve(api.account_state()).then(function (st) {
        if (st && st.unlocked) {
          location.replace('index.html#quchen-desktop');
          return;
        }
        if (st && st.email) emailEl.value = st.email;
      }).catch(function () {});
    } catch (e) {}
  }

  window.addEventListener('pywebviewready', ready);
  window.addEventListener('DOMContentLoaded', function () { setTimeout(ready, 300); });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!api) { setMsg('账号服务未就绪，请稍候重试', true); return; }
    var email = (emailEl.value || '').trim();
    var password = passEl.value || '';
    if (!email || !password) { setMsg('请填写邮箱与密码', true); return; }
    btn.disabled = true;
    setMsg('正在登录…', false);
    Promise.resolve(api.account_login(email, password)).then(function (res) {
      if (res && res.ok) {
        setMsg('登录成功，正在进入…', false);
        setTimeout(function () { location.replace('index.html#quchen-desktop'); }, 220);
        return;
      }
      btn.disabled = false;
      var text = (res && (res.message || res.code)) || '登录失败';
      if (res && res.code === 'bad_credentials') text = '邮箱或密码不正确';
      if (res && res.code === 'pending_approval') text = '账号正在等待管理员审批';
      if (res && res.code === 'account_disabled') text = '账号已被停用，请联系管理员';
      setMsg(text, true);
    }).catch(function (err) {
      btn.disabled = false;
      setMsg('登录失败：' + (err && err.message ? err.message : err), true);
    });
  });
})();

/* ===== QuChen 注册视图：登录 / 注册切换 + 邮箱验证码注册 ===== */
(function () {
  var pane = document.getElementById('qcRegPane');
  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  if (!pane || !tabLogin || !tabRegister) return;

  function apiObj() { return (window.pywebview && window.pywebview.api) || null; }
  function show(text, kind) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = text || '';
    m.className = 'msg' + (kind === 'err' ? ' err' : '');
    m.style.color = kind === 'err' ? '#ff6b6b' : kind === 'ok' ? '#3ecf8e' : kind === 'warn' ? '#f0b34a' : '';
  }
  function val(id) {
    var el = document.getElementById(id);
    return el ? String(el.value || '').trim() : '';
  }
  function paint(mode) {
    var reg = mode === 'register';
    ['email', 'password', 'submit'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = reg ? 'none' : '';
    });
    var lab = document.querySelectorAll('label[for="email"], label[for="password"]');
    for (var i = 0; i < lab.length; i++) lab[i].style.display = reg ? 'none' : '';
    pane.style.display = reg ? '' : 'none';
    tabLogin.style.background = reg ? 'transparent' : 'rgba(255,255,255,.10)';
    tabLogin.style.color = reg ? '#8b93a3' : '#e8ecf2';
    tabLogin.style.fontWeight = reg ? '400' : '600';
    tabRegister.style.background = reg ? 'rgba(255,255,255,.10)' : 'transparent';
    tabRegister.style.color = reg ? '#e8ecf2' : '#8b93a3';
    tabRegister.style.fontWeight = reg ? '600' : '400';
    var focus = document.getElementById(reg ? 'regEmail' : 'email');
    if (focus) { try { focus.focus(); } catch (e) {} }
    if (!reg) show('', false);
  }
  tabLogin.addEventListener('click', function () { paint('login'); });
  tabRegister.addEventListener('click', function () { paint('register'); });
  paint('login');

  function codeMap(res) {
    var code = (res && res.code) || '';
    var map = {
      email_taken: '该邮箱已注册，请直接登录或找回密码。',
      no_code: '请先获取验证码。',
      code_expired: '验证码已过期，请重新获取。',
      code_wrong: '验证码不正确，请检查后重试。',
      code_locked: '验证码错误次数过多，请重新获取。',
      too_soon: '发送太频繁，请稍后再试。',
      smtp_failed: '验证码邮件发送失败，请稍后重试。',
      bad_request: '请检查填写内容。',
      unreachable: '连不上账号服务，请确认网络后重试。',
      weak_password: '密码需 8-128 位，请重新设置。',
      pending_approval: '账号待管理员审批，通过后即可登录。',
      bad_credentials: '邮箱或密码不正确。',
      locked: '密码错误次数过多，请稍后再试或重置密码。',
      too_many_devices: '设备数已达上限，请先在账号中心移出旧设备。'
    };
    if (map[code]) return map[code];
    return (res && res.message) || '操作失败，请重试。';
  }

  var sendBtn = document.getElementById('regSend');
  var left = 0;
  var timer = null;
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    left = 0;
    if (sendBtn) {
      sendBtn.disabled = false;
      sendBtn.style.opacity = '1';
      sendBtn.textContent = '获取验证码';
    }
  }
  function tick() {
    left -= 1;
    if (left <= 0) { stopTimer(); return; }
    sendBtn.textContent = left + ' 秒后重发';
  }
  if (sendBtn) {
    sendBtn.addEventListener('click', function () {
      var api = apiObj();
      var email = val('regEmail');
      if (!email) { show('请先填写邮箱。', 'err'); var e = document.getElementById('regEmail'); if (e) e.focus(); return; }
      if (!api || !api.account_send_code) { show('账号服务未就绪，请稍候重试', 'err'); return; }
      sendBtn.disabled = true;
      sendBtn.style.opacity = '.6';
      sendBtn.textContent = '发送中…';
      Promise.resolve(api.account_send_code(email, 'register')).then(function (res) {
        if (res && res.ok) {
          left = Math.max(30, Number(res.resend_after) || 60);
          if (timer) clearInterval(timer);
          timer = setInterval(tick, 1000);
          sendBtn.disabled = true;
          sendBtn.style.opacity = '.6';
          show(res.message || '验证码已发送，10 分钟内有效。', 'ok');
          var c = document.getElementById('regCode');
          if (c) c.focus();
        } else {
          stopTimer();
          show(codeMap(res), 'err');
        }
      }).catch(function (err) {
        stopTimer();
        show('验证码发送失败：' + ((err && err.message) || err), 'err');
      });
    });
  }

  var submit = document.getElementById('regSubmit');
  function finish(msg, kind) {
    if (submit) { submit.disabled = false; submit.textContent = '注册账号'; }
    show(msg, kind);
  }
  if (submit) {
    submit.addEventListener('click', function () {
      var api = apiObj();
      var email = val('regEmail');
      var code = val('regCode');
      var pwd = document.getElementById('regPassword') ? document.getElementById('regPassword').value || '' : '';
      var pwd2 = document.getElementById('regPassword2') ? document.getElementById('regPassword2').value || '' : '';
      if (!email) { show('请填写邮箱。', 'err'); return; }
      if (!/^\d{6}$/.test(code)) { show('请填写邮箱收到的 6 位验证码。', 'err'); return; }
      if (pwd.length < 8) { show('密码至少 8 位。', 'err'); return; }
      if (pwd !== pwd2) { show('两次输入的密码不一致。', 'err'); return; }
      if (!api || !api.account_register) { show('账号服务未就绪，请稍候重试', 'err'); return; }
      submit.disabled = true;
      submit.textContent = '注册中…';
      Promise.resolve(api.account_register(email, code, pwd)).then(function (res) {
        if (!res || !res.ok) { finish(codeMap(res), 'err'); return; }
        if (res.status === 'active') {
          show('注册成功，正在登录…', 'ok');
          return Promise.resolve(api.account_login(email, pwd)).then(function (r) {
            if (r && r.ok) {
              show('登录成功，正在进入…', 'ok');
              setTimeout(function () { location.replace('index.html#quchen-desktop'); }, 220);
              return;
            }
            finish('注册成功，请用该邮箱登录。', 'warn');
          }).catch(function () {
            finish('注册成功，请用该邮箱登录。', 'warn');
          });
        }
        finish(res.message || '注册成功，等待管理员审批后即可登录。', 'ok');
      }).catch(function (err) {
        finish('注册失败：' + ((err && err.message) || err), 'err');
      });
    });
  }
})();

</script>
</body>
</html>
