name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.1），留空则用 tag"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ver = (Select-String -Path app/backend/service.py -Pattern 'APP_VER\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          if (-not $ver) { throw "no APP_VER in app/backend/service.py" }
          $tag = "$env:INPUT_VERSION"
          if (-not $tag) {
            if ("${{ github.ref_type }}" -ne "tag") { throw "workflow_dispatch needs a version (e.g. v1.0.8) when it is not run from a tag" }
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          if ($tag.TrimStart('v') -ne $ver) { throw "tag $tag does not match APP_VER $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "version $ver, tag $tag"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pythonnet requests pyyaml pillow pyinstaller

      - name: Fetch mihomo core
        shell: pwsh
        run: |
          $api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          $rel = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "qc-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match "windows-amd64-compatible" -and $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match "windows-amd64" -and $_.name -like "*.zip" } | Select-Object -First 1 }
          Write-Host "downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mihomo.zip
          Expand-Archive mihomo.zip -DestinationPath mihomo_tmp -Force
          New-Item -ItemType Directory -Force -Path runtime\core | Out-Null
          $exe = Get-ChildItem mihomo_tmp -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName runtime\core\mihomo.exe -Force
          Write-Host "core: $($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Fetch geo data
        shell: pwsh
        run: |
          $base = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest"
          Invoke-WebRequest -Uri "$base/geoip.metadb" -OutFile runtime\core\GEOIP.metadb
          Invoke-WebRequest -Uri "$base/geosite.dat" -OutFile runtime\core\GEOSITE.dat
          Get-ChildItem runtime\core | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build node pool
        shell: pwsh
        run: python tools\build_seed.py --keep 2500

      - name: Build package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem release | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "QuChen VPN ${{ steps.ver.outputs.tag }}"
          files: |
            release/QuChenVPN-win64.zip
            release/QuChenVPN-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
